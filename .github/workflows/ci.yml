name: Gold ERP CI

on:
  push:
    branches:
      - main
      - 'hotfix/**'
      - 'phase/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gold-erp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint -- .

      - name: Production build
        run: npm run build

  # ===========================================================================
  # REAL PostgreSQL verification — the ENTIRE SQL suite.
  # ===========================================================================
  # The `verify` job above only ever exercised the TypeScript side. Every
  # supabase/migrations/*.sql and supabase/tests/*.test.sql file was entirely
  # unverified by CI, which is how Phase 9 shipped an RLS policy that made
  # every direct SELECT on inventory_stock_movements fail (fixed in 0231) and
  # an update_inventory_item() that failed on every call (fixed in 0232) — both
  # apply cleanly, and only break when actually exercised against a live
  # server.
  #
  # This job runs a genuine PostgreSQL 16 instance as a service and executes
  # ALL THREE kinds of SQL suite against it, each the way it is meant to run:
  #   * regular      — one pristine database clone per file
  #   * concurrency  — one clone per file, plus dblink, two real sessions
  #   * upgrade      — each script builds its own historical baseline
  # No file is skipped and no step uses continue-on-error.
  sql:
    name: SQL suite — regular, concurrency, upgrade (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # The official image ships postgresql-contrib, which is where `dblink`
        # comes from — the multi-session concurrency test below needs it to
        # open two genuinely independent server-side sessions.
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      # NOTE: DATABASE_URL is deliberately NOT set here. Every upgrade script
      # drops and recreates whatever database its own DATABASE_URL names, so a
      # single shared value would make the scripts overwrite each other's
      # database; the "Run upgrade suites" step below sets a distinct one per
      # script instead.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pure file check — no database needed, so it runs first and fails fast.
      - name: SQL test coverage (no orphaned test files)
        # supabase/tests/upgrade_phase8_reports_dashboard.test.sql sat in the
        # repository with no runner script for its whole life: it was never
        # executed anywhere, by anyone, and nothing noticed. This step makes
        # that class of gap impossible — every *.test.sql must be reachable by
        # a concrete execution path:
        #   *concurrency*.test.sql -> the concurrency loop below
        #   upgrade_*.test.sql     -> MUST be named by some scripts/*.sh runner
        #   everything else        -> the regular loop below
        # Note it validates the TEST files. A runner that deliberately asserts
        # a MIGRATION fails and so runs no .test.sql at all
        # (run_upgrade_test_hotfix_7_1_3_broken_fixture.sh) is correctly not
        # flagged here: it is a script, not an unreferenced test file, and it
        # is executed by the upgrade loop like every other runner.
        run: |
          set -euo pipefail
          orphans=0
          for f in supabase/tests/*.test.sql; do
            base="$(basename "$f")"
            case "$base" in
              *concurrency*) continue ;;
              upgrade_*)
                if grep -rqF -- "$base" scripts/*.sh; then
                  echo "ok (upgrade runner found): $base"
                else
                  echo "ORPHAN: $base has no runner in scripts/*.sh — it would never execute"
                  orphans=1
                fi
                ;;
              *) continue ;;
            esac
          done
          if [ "$orphans" -ne 0 ]; then
            echo "FAILED: at least one SQL test file has no execution path."
            exit 1
          fi
          echo "All SQL test files are wired to an execution path."

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Verify server is reachable and dblink is available
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "select version();"
          # Fail loudly here rather than deep inside the concurrency test if
          # the image ever stops shipping contrib.
          psql -v ON_ERROR_STOP=1 -d postgres -tAc \
            "select 1 from pg_available_extensions where name = 'dblink';" | grep -q 1

      - name: Create Supabase roles (cluster-wide)
        # These exact role names are what every RLS policy and GRANT in
        # supabase/migrations references; supabase/tests/local_harness_setup.sql
        # documents this same bootstrap.
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "create role anon nologin;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "create role authenticated nologin;"
          psql -v ON_ERROR_STOP=1 -d postgres -c "create role service_role nologin bypassrls;"

      # ---------------------------------------------------------------------
      # TEMPLATE database — built ONCE, then cloned per test.
      # ---------------------------------------------------------------------
      # Isolation matters here: several suites commit real rows (the
      # concurrency files run with no wrapping transaction at all), and many
      # share fixed fixture UUIDs, so running them against one shared database
      # would let one test's leftovers decide another's outcome. Rebuilding 232
      # migrations + seed per test would cost minutes each, so the schema is
      # built once into a TEMPLATE and every test gets a byte-identical clone
      # via `CREATE DATABASE ... TEMPLATE` (a file-level copy, ~a second).
      # Each test therefore starts from exactly the same pristine state and
      # cannot observe any other test.
      - name: Build template database (harness + all migrations + seed)
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c 'create database gold_erp_template;'
          psql -v ON_ERROR_STOP=1 -d gold_erp_template -q -f supabase/tests/local_harness_setup.sql
          for f in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -d gold_erp_template -q -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -d gold_erp_template -q -f supabase/seed.sql

      # ---------------------------------------------------------------------
      # Regular suites — one clean clone each.
      # ---------------------------------------------------------------------
      # Every *.test.sql that is not a concurrency or upgrade file. `set -e`
      # plus ON_ERROR_STOP means the first failing file fails the job; there
      # is deliberately no continue-on-error and no skip list anywhere in this
      # job.
      - name: Run regular SQL suites
        run: |
          set -euo pipefail
          fail=0
          for f in supabase/tests/*.test.sql; do
            base="$(basename "$f" .test.sql)"
            case "$base" in
              *concurrency*|upgrade_*) continue ;;
            esac
            db="t_$(echo "$base" | tr -c 'a-zA-Z0-9' '_' | cut -c1-50)"
            echo "::group::$base"
            psql -v ON_ERROR_STOP=1 -d postgres -q -c "create database $db template gold_erp_template;"
            if psql -v ON_ERROR_STOP=1 -d "$db" -f "$f"; then
              echo "PASS $base"
            else
              echo "FAIL $base"
              fail=1
            fi
            psql -v ON_ERROR_STOP=1 -d postgres -q -c "drop database $db;"
            echo "::endgroup::"
          done
          exit $fail

      # ---------------------------------------------------------------------
      # Concurrency suites — one clean clone each, plus dblink.
      # ---------------------------------------------------------------------
      # These open two genuinely independent server-side sessions through
      # dblink and assert on real lock contention, so they must never share a
      # database with anything else. dblink connects from the SERVER back to
      # itself, so the conninfo resolves inside the service container
      # (127.0.0.1:5432 there), not from the runner.
      #
      # POSTGRES_PASSWORD above is load-bearing for these: dblink refuses a
      # connection opened by a NON-superuser (several of these files call
      # dblink_connect after `set local role authenticated`) unless the
      # connection actually authenticated with a password. A trust-auth server
      # fails them with "password or GSSAPI delegated credentials required"
      # even though a password was supplied.
      - name: Run concurrency SQL suites (two real sessions via dblink)
        run: |
          set -euo pipefail
          fail=0
          for f in supabase/tests/*concurrency*.test.sql; do
            base="$(basename "$f" .test.sql)"
            db="c_$(echo "$base" | tr -c 'a-zA-Z0-9' '_' | cut -c1-50)"
            echo "::group::$base"
            psql -v ON_ERROR_STOP=1 -d postgres -q -c "create database $db template gold_erp_template;"
            psql -v ON_ERROR_STOP=1 -d "$db" -q -c 'create extension if not exists dblink;'
            if psql -v ON_ERROR_STOP=1 -d "$db" \
                 -v "dblink_conninfo=host=127.0.0.1 port=5432 user=postgres password=postgres" \
                 -f "$f"; then
              echo "PASS $base"
            else
              echo "FAIL $base"
              fail=1
            fi
            psql -v ON_ERROR_STOP=1 -d postgres -q -c "drop database $db;"
            echo "::endgroup::"
          done
          exit $fail

      # ---------------------------------------------------------------------
      # Upgrade suites — each script builds its OWN baseline.
      # ---------------------------------------------------------------------
      # These cannot use the template: each one deliberately builds a database
      # up to a specific historical migration, applies the REAL seed.sql at
      # that point, then applies the newer migrations on top in a separate
      # psql invocation — reproducing what a production upgrade actually
      # experiences. Each script drops/recreates the database named in its own
      # DATABASE_URL, so each script gets a distinct database name.
      - name: Run upgrade suites
        run: |
          set -euo pipefail
          fail=0
          for s in scripts/run_upgrade_test*.sh; do
            base="$(basename "$s" .sh)"
            db="u_$(echo "$base" | tr -c 'a-zA-Z0-9' '_' | cut -c1-50)"
            echo "::group::$base"
            if DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/$db" bash "$s"; then
              echo "PASS $base"
            else
              echo "FAIL $base"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
